services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maintidoc
      POSTGRES_PASSWORD: maintidoc-demo
      POSTGRES_DB: maintidoc
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintidoc -d maintidoc"]
      interval: 5s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: maintidoc
      MINIO_ROOT_PASSWORD: maintidoc-demo-secret
    ports:
      - "9000:9000"
      - "9001:9001"

  mlflow:
    build: .
    command: python -m mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db
    ports:
      - "5000:5000"

  mcp:
    build: .
    command: python scripts/mcp_server.py
    environment:
      APP_SECRET: maintidoc-demo-secret
      STORAGE_BACKEND: local
    ports:
      - "8001:8001"

  api:
    build: .
    command: python scripts/api_server.py
    environment:
      APP_SECRET: maintidoc-demo-secret
      STORAGE_BACKEND: external
      DATABASE_URL: postgresql+psycopg://maintidoc:maintidoc-demo@postgres:5432/maintidoc
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: maintidoc
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: maintidoc
      MINIO_SECRET_KEY: maintidoc-demo-secret
      MINIO_BUCKET: maintidoc
      MINIO_SECURE: "0"
      MCP_URL: http://mcp:8001
      MCP_TRANSPORT: http
      MLFLOW_TRACKING_URI: http://mlflow:5000
      API_URL: http://api:8000
      USE_VLM: "0"
      USE_HEAVY_MODELS: "0"
      RERANKER_MODE: adapted
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
      mcp:
        condition: service_started
      mlflow:
        condition: service_started

  ui:
    build: .
    command: python scripts/ui.py
    environment:
      API_URL: http://api:8000
      APP_SECRET: maintidoc-demo-secret
    ports:
      - "8501:8501"
    depends_on:
      - api
